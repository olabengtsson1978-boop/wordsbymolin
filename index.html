<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words by Molin</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  #contact {
    position: fixed; bottom: 20px; right: 20px; z-index: 10;
    font: 14px Georgia, serif; letter-spacing: 0.08em;
    color: rgba(240,232,215,0.7); text-decoration: none;
    padding: 8px 16px; border: 1px solid rgba(240,232,215,0.3);
    border-radius: 999px; background: rgba(0,0,0,0.4);
    transition: color .3s, border-color .3s;
  }
  #contact:hover { color: #f0e8d7; border-color: rgba(240,232,215,0.8); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="contact" href="mailto:me@wordsbymolin.com">contact</a>
<script>
const WORDS = ["ord","tystnad","minne","ljus","andetag","hav","längtan","natt",
  "berättelse","röst","stjärna","eko","hem","tid","dröm","sanning","vind",
  "saknad","början","slut","kanske","alltid","aldrig","du","jag","vi"];

const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, cx, cy, R, BASE;
const DEPTH = 2000, RINGS = 40, PER_RING = 12, FOV = 300;
const NEAR = 20;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  R = Math.min(W, H) * 0.42;
  BASE = Math.max(10, Math.min(W, H) / 45);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}
addEventListener('resize', resize);
resize();
cx = W / 2; cy = H / 2;

// Varje ord ligger på en ring i tunneln; ringarna förskjuts lite i vinkel
// så att orden bildar en spiral.
const pick = () => WORDS[Math.floor(Math.random() * WORDS.length)];
const items = [];
for (let r = 0; r < RINGS; r++) {
  const z = NEAR + (r + 1) * (DEPTH / RINGS);
  for (let i = 0; i < PER_RING; i++) {
    items.push({
      word: pick(),
      angle: (i / PER_RING) * Math.PI * 2 + r * 0.18,
      z,
      wobble: Math.random() * Math.PI * 2
    });
  }
}

// Interaktion: pekaren flyttar flyktpunkten, nedtryckt pekare ökar farten.
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CRUISE = reduceMotion ? 0.6 : 2.2, BOOST = reduceMotion ? 2 : 14;
let speed = CRUISE, targetSpeed = CRUISE, spin = 0;
let tx = 0.5, ty = 0.5, mx = 0.5, my = 0.5, pressed = false;

c.addEventListener('pointermove', e => { tx = e.clientX / W; ty = e.clientY / H; });
c.addEventListener('pointerdown', e => {
  pressed = true; tx = e.clientX / W; ty = e.clientY / H;
  c.setPointerCapture(e.pointerId);
});
const release = () => { pressed = false; };
c.addEventListener('pointerup', release);
c.addEventListener('pointercancel', release);
c.addEventListener('pointerleave', () => { if (!pressed) { tx = 0.5; ty = 0.5; } });
addEventListener('keydown', e => { if (e.code === 'Space') pressed = true; });
addEventListener('keyup', e => { if (e.code === 'Space') pressed = false; });

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 16.67, 3);
  last = now;

  targetSpeed = pressed ? BOOST : CRUISE;
  speed += (targetSpeed - speed) * 0.05 * dt;
  spin += 0.0012 * dt * (reduceMotion ? 0.3 : 1);
  mx += (tx - mx) * 0.04 * dt;
  my += (ty - my) * 0.04 * dt;
  cx = W / 2 + (0.5 - mx) * W * 0.35;
  cy = H / 2 + (0.5 - my) * H * 0.35;

  // Halvgenomskinlig övermålning ger mjuka rörelsespår, längre i hög fart.
  ctx.fillStyle = `rgba(0,0,0,${0.32 - Math.min(speed / BOOST, 1) * 0.2})`;
  ctx.fillRect(0, 0, W, H);

  for (const it of items) {
    it.z -= speed * dt;
    if (it.z < NEAR) { it.z += DEPTH; it.word = pick(); }
  }
  items.sort((a, b) => b.z - a.z);

  for (const it of items) {
    const s = FOV / it.z;
    const size = BASE * s;
    if (size < 2 || size > 400) continue;
    const a = it.angle + spin;
    const rr = R * s * (1 + 0.04 * Math.sin(now * 0.001 + it.wobble));
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (x < -size * 4 || x > W + size * 4 || y < -size * 2 || y > H + size * 2) continue;

    // Tona in på avstånd, tona ut när ordet passerar förbi.
    const far = 1 - it.z / DEPTH;
    const near = Math.min(1, (it.z - NEAR) / 120);
    const alpha = Math.max(0, far * far * near);
    if (alpha < 0.01) continue;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.PI / 2);
    ctx.font = `${size.toFixed(1)}px Georgia, serif`;
    ctx.fillStyle = `rgba(240,232,215,${alpha.toFixed(3)})`;
    ctx.fillText(it.word, 0, 0);
    ctx.restore();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
